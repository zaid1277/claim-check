[project]
name = "claim-check-api"
version = "0.1.0"
description = "Evidence investigation API with local retrieval and NLI"
requires-python = ">=3.12"
dependencies = [
    "tldextract>=5,<6",
    "spacy==3.8.16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
    "trafilatura>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.4.4"]
ml = ["sentence-transformers==5.7.0", "transformers==4.57.6", "torch==2.14.0"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "setuptools>=75"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to PostgreSQL"]
