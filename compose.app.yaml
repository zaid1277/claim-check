services:
  api:
    build: ./api
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL in .env}
      ALLOW_RUNTIME_PROVIDER_KEYS: "false"
      PROVIDER_MODE: ${PROVIDER_MODE:-fixture}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      HF_HOME: /home/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/home/app/.cache/huggingface
    command: ["sh", "-c", "python -m app.db.migrate && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./web
      args:
        API_BASE_URL: http://api:8000
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  model_cache:
