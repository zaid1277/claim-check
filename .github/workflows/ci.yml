name: Claim Check verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: claim_check
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: claim_check_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claim_check -d claim_check_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://claim_check:ci_only_password@localhost:5432/claim_check_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check . ../evaluation
      - run: ruff format --check . ../evaluation
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:extension
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m venv ../api/.venv
          ../api/.venv/bin/python -m pip install -r ../api/requirements-dev.lock
          ../api/.venv/bin/python -m pip install --no-deps --no-build-isolation -e ../api
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --config=playwright.release.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: web/test-results/

